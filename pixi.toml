[project]
name = "pygsrs"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "osx-64", "win-64"]

[dependencies]
python = ">=3.10"
httpx = ">=0.27"
tenacity = ">=8.2"
pandas = ">=2.0"
pytest = ">=8.0"
pytest-timeout = ">=2.3"
hatchling = ">=1.25"

[tasks]
test = "pytest tests/ -v"
install = "pip install -e . --no-build-isolation"
