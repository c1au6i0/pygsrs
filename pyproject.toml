[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pygsrs"
version = "0.1.0"
description = "Python client for the FDA Global Substance Registration System (GSRS) API"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "tenacity>=8.2",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-timeout>=2.3", "pytest-httpx>=0.30", "ruff>=0.4", "mypy>=1.10", "pandas-stubs>=2.0"]
cache = ["diskcache>=5.6"]

[project.scripts]
pygsrs = "pygsrs._cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pygsrs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 60

[tool.ruff]
src = ["src"]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "PIE"]
ignore = ["E501"]  # line-length enforced by formatter

[tool.mypy]
python_version = "3.10"
strict = false
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
