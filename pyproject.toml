[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pygsrs"
version = "0.1.0"
description = "Python client for the FDA Global Substance Registration System (GSRS) API"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "tenacity>=8.2",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-timeout>=2.3"]

[tool.hatch.build.targets.wheel]
packages = ["src/pygsrs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 60
